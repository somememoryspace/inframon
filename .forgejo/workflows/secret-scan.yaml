# Secret scan gate: gitleaks over every commit reachable from the checked-out
# HEAD (on a pull request, the merge of the branch into main), with
# .gitleaks.toml and .gitleaksignore. Local equivalent: scripts/hooks/pre-commit.
# Standards: px-docs STD-SEC-01.R1, STD-SEC-02.R15, STD-INF-04.R2.
#
# Runs on the platform gvisor pool (runner label `gvisor`, STD-WLD-04.R17).
# Steps run in the runner Pod (host mode, no `container:`), so gitleaks comes
# from the forgejo-runner image, pinned by digest in px-gitops
# devops-tenant-platform (STD-WLD-04.R8), not from a download in this job.
# The job reads no secret and requests no OIDC token, so pull request runs,
# including agent forks, are safe (STD-SEC-01.R16).
name: secret-scan

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gitleaks:
    runs-on: gvisor
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks version
        run: |
          command -v gitleaks >/dev/null || { echo "gitleaks is not in the runner image (px-containers forgejo-runner)"; exit 1; }
          installed=$(gitleaks version | sed 's/^v//')
          [ "$installed" = "$GITLEAKS_VERSION" ] || { echo "gitleaks $installed in runner image, workflow pins $GITLEAKS_VERSION"; exit 1; }
      - name: Scan history (redacted)
        run: gitleaks git . --config .gitleaks.toml --log-opts=HEAD --redact --no-banner --verbose --exit-code 1
